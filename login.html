<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- Memuat library Supabase dari CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Daftar / Login - Linkfoo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<main class="stage">
  <form class="pill tall" id="form" novalidate>
    <h1>Bergabunglah dengan Linkfoo</h1>
    <p class="sub" id="sub">Daftar Secara Gratis</p>
    <input class="field" type="email" id="email" placeholder="Email" autocomplete="email" required>
    <input class="field" type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="submit" type="submit">Daftar</button>
    <p class="alt" id="alt"></p>
    <p class="alt"><a href="index.html">&larr; Kembali ke halaman utama</a></p>
  </form>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  let mode = new URLSearchParams(location.search).get('mode') === 'login' ? 'login' : 'register';
  const $ = id => document.getElementById(id);

  function render() {
    const reg = mode === 'register';
    $('sub').textContent = reg ? 'Daftar Secara Gratis' : 'Masuk ke akun kamu';
    $('submit').textContent = reg ? 'Daftar' : 'Masuk';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('alt').innerHTML = reg
      ? 'Sudah punya akun? <button type="button" id="sw">Masuk</button>'
      : 'Belum punya akun? <button type="button" id="sw">Daftar</button>';
    $('sw').onclick = () => { mode = reg ? 'login' : 'register'; render(); };
  }
  render();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('pass').value;
    if (!LF.validEmail(email)) return LF.toast('Email tidak valid');
    if (pass.length < 6) return LF.toast('Password minimal 6 karakter');
    const btn = $('submit'); btn.disabled = true;
    const users = LF.get('lf_users', {});
    const h = await LF.hash(pass);

    if (mode === 'login') {
      if (!users[email] || !users[email].verified) { btn.disabled = false; return LF.toast('Akun belum terdaftar'); }
      if (users[email].hash !== h) { btn.disabled = false; return LF.toast('Password salah'); }
      LF.set('lf_session', { email });
      location.href = 'edit.html';
      return;
    }

    if (users[email] && users[email].verified) { btn.disabled = false; return LF.toast('Email sudah terdaftar, silakan masuk'); }
    LF.set('lf_pending', { email, hash: h });
    const r = await LF.sendOtp(email);
    if (r.error) { btn.disabled = false; return LF.toast(r.error); }
    location.href = 'otp.html';
  });
})();
</script>
</body>
</html>
