<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edit - Linkfoo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<main class="stage">
  <section class="pill edit">
    <h1>Edit Linkfoo</h1>
    <p class="sub" id="who"></p>

    <div class="sec">
      <h3>Foto profil</h3>
      <div class="media">
        <div class="thumb" id="avPrev"></div>
        <div class="btnrow">
          <label class="btn-sm" for="avFile">Pilih foto</label>
          <button class="btn-sm danger" id="avDel" type="button">Hapus</button>
        </div>
        <input type="file" id="avFile" accept="image/*" hidden>
      </div>
    </div>

    <div class="sec">
      <h3>Background</h3>
      <div class="media">
        <div class="thumb bg" id="bgPrev"></div>
        <div class="btnrow">
          <label class="btn-sm" for="bgFile">Pilih gambar</label>
          <button class="btn-sm danger" id="bgDel" type="button">Hapus</button>
        </div>
        <input type="file" id="bgFile" accept="image/*" hidden>
      </div>
    </div>

    <div class="sec">
      <label for="username">Username</label>
      <input class="field" id="username" maxlength="30" placeholder="username" style="margin:0">
    </div>

    <div class="sec">
      <label for="title">Title (tampil di landing page)</label>
      <input class="field" id="title" maxlength="60" placeholder="Contoh: Kreator Konten" style="margin:0">
    </div>

    <div class="sec">
      <h3>Link</h3>
      <div id="list"></div>
      <button class="btn-sm ghost" id="add" type="button">+ Tambah link</button>
    </div>

    <div class="actions">
      <button class="btn" id="save" type="button">Simpan</button>
      <a class="btn ghost" href="index.html" style="text-align:center;line-height:58px;text-decoration:none">Lihat halaman</a>
    </div>
    <p class="alt" style="text-align:center"><button type="button" id="logout">Logout</button></p>
  </section>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script src="js/app.js"></script>
<script>
(function () {
  const s = LF.session();
  if (!s) { location.replace('login.html?mode=login'); return; }
  const $ = id => document.getElementById(id);
  $('who').textContent = s.email;

  const st = Object.assign(LF.emptyProfile(s.email), LF.profile() || {});
  st.links = (st.links || []).map(l => ({ label: l.label || '', url: l.url || '' }));
  let dirty = false;
  const mark = () => { dirty = true; };

  function previews() {
    $('avPrev').innerHTML = '';
    if (st.avatar) { const i = new Image(); i.src = st.avatar; $('avPrev').appendChild(i); }
    else $('avPrev').innerHTML = LF.defaultAvatar;
    $('bgPrev').style.backgroundImage = st.bg ? 'url("' + st.bg + '")' : '';
  }

  function renderLinks() {
    const box = $('list'); box.innerHTML = '';
    if (!st.links.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Belum ada link. Tekan "Tambah link".'; box.appendChild(p); }
    st.links.forEach((l, i) => {
      const row = document.createElement('div'); row.className = 'li';
      const ins = document.createElement('div'); ins.className = 'inputs';
      const a = document.createElement('input'); a.className = 'field'; a.placeholder = 'Nama tombol (mis. Instagram)'; a.value = l.label; a.maxLength = 40;
      a.oninput = () => { l.label = a.value; mark(); };
      const b = document.createElement('input'); b.className = 'field'; b.placeholder = 'https://...'; b.value = l.url; b.type = 'url'; b.inputMode = 'url';
      b.oninput = () => { l.url = b.value; mark(); };
      ins.append(a, b);
      const d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.title = 'Hapus link'; d.textContent = '×';
      d.onclick = () => { if (confirm('Hapus link ini?')) { st.links.splice(i, 1); mark(); renderLinks(); } };
      row.append(ins, d); box.appendChild(row);
    });
  }

  async function pick(file, key, max) {
    if (!file) return;
    try { st[key] = await LF.resizeImage(file, max); mark(); previews(); }
    catch (e) { LF.toast('Gagal membaca gambar'); }
  }
  $('avFile').onchange = e => { pick(e.target.files[0], 'avatar', 600); e.target.value = ''; };
  $('bgFile').onchange = e => { pick(e.target.files[0], 'bg', 1600); e.target.value = ''; };
  $('avDel').onclick = () => { st.avatar = ''; mark(); previews(); };
  $('bgDel').onclick = () => { st.bg = ''; mark(); previews(); };

  $('username').value = st.username; $('title').value = st.title;
  $('username').oninput = () => { st.username = $('username').value.replace(/[^a-zA-Z0-9_.]/g, '').toLowerCase(); mark(); };
  $('title').oninput = () => { st.title = $('title').value; mark(); };
  $('add').onclick = () => { st.links.push({ label: '', url: '' }); mark(); renderLinks(); const f = $('list').querySelectorAll('.li'); f[f.length - 1].querySelector('input').focus(); };

  $('save').onclick = () => {
    $('username').value = st.username;
    const out = Object.assign({}, st, { links: st.links.filter(l => l.label.trim() || l.url.trim()).map(l => ({ label: l.label.trim(), url: l.url.trim() })) });
    if (!LF.set('lf_profile', out)) return LF.toast('Penyimpanan penuh. Pakai gambar yang lebih kecil.');
    st.links = out.links; renderLinks(); dirty = false; LF.toast('Tersimpan!');
  };
  $('logout').onclick = () => { LF.del('lf_session'); location.href = 'index.html'; };
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  previews(); renderLinks();
})();
</script>
</body>
</html>
