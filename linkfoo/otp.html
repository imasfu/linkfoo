<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verifikasi OTP - Linkfoo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<main class="stage">
  <section class="pill tall">
    <h1>Verifikasi kode OTP</h1>
    <p class="sub" style="margin-bottom:0">Masukkan kode yang kamu terima<br>lewat email ke <span id="mail"></span></p>
    <div class="otp" id="otp">
      <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
    </div>
    <button class="btn" id="go" type="button">Kirim OTP</button>
    <p class="alt"><button type="button" id="resend">Kirim Ulang</button></p>
    <div class="demo-note" id="demo" hidden></div>
  </section>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const pending = LF.get('lf_pending', null);
  if (!pending) { location.replace('login.html'); return; }
  $('mail').textContent = pending.email;

  const boxes = [...document.querySelectorAll('#otp input')];
  boxes[0].focus();

  function showDemo() {
    const o = LF.get('lf_otp', null);
    if (o && o.mode === 'demo') {
      const d = $('demo'); d.hidden = false;
      d.innerHTML = 'Mode demo: server email belum diatur, jadi kode tidak dikirim ke email. Kode kamu: <b>' + o.code + '</b>';
    } else $('demo').hidden = true;
  }
  showDemo();

  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      b.value = b.value.replace(/\D/g, '').slice(-1);
      if (b.value && i < 3) boxes[i + 1].focus();
      if (boxes.every(x => x.value)) submit();
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && i > 0) boxes[i - 1].focus();
      if (e.key === 'Enter') submit();
    });
    b.addEventListener('paste', e => {
      const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (!t) return; e.preventDefault();
      t.split('').forEach((c, k) => boxes[k].value = c);
      boxes[Math.min(t.length, 3)].focus();
      if (t.length === 4) submit();
    });
  });

  let busy = false;
  async function submit() {
    if (busy) return;
    const code = boxes.map(b => b.value).join('');
    if (code.length < 4) return LF.toast('Masukkan 4 digit kode OTP');
    busy = true; $('go').disabled = true;
    const ok = await LF.verifyOtp(code);
    if (!ok) {
      busy = false; $('go').disabled = false;
      boxes.forEach(b => b.value = ''); boxes[0].focus();
      return LF.toast('Kode OTP salah atau kedaluwarsa');
    }
    const users = LF.get('lf_users', {});
    users[pending.email] = { hash: pending.hash, verified: true };
    LF.set('lf_users', users);
    LF.set('lf_session', { email: pending.email });
    if (!LF.profile()) LF.set('lf_profile', LF.emptyProfile(pending.email));
    LF.del('lf_pending'); LF.del('lf_otp');
    location.href = 'edit.html';
  }
  $('go').onclick = submit;

  // kirim ulang dengan jeda 60 detik
  let left = 0, timer;
  function tick() {
    const b = $('resend');
    if (left > 0) { b.disabled = true; b.textContent = 'Kirim Ulang (' + left + 'd)'; left--; }
    else { b.disabled = false; b.textContent = 'Kirim Ulang'; clearInterval(timer); }
  }
  function cooldown() { left = 60; tick(); clearInterval(timer); timer = setInterval(tick, 1000); }
  const o0 = LF.get('lf_otp', null);
  if (o0 && Date.now() - o0.sentAt < 60000) { left = Math.ceil((60000 - (Date.now() - o0.sentAt)) / 1000); tick(); timer = setInterval(tick, 1000); }
  $('resend').onclick = async () => {
    const r = await LF.sendOtp(pending.email);
    if (r.error) return LF.toast(r.error);
    showDemo(); cooldown(); LF.toast('Kode OTP dikirim ulang');
    boxes.forEach(b => b.value = ''); boxes[0].focus();
  };
})();
</script>
</body>
</html>
