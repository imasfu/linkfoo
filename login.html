<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daftar / Login - Linkfoo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  }
  
  body {
    background: #8f9296; /* Warna latar belakang silver/abu halus */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .stage {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Kapsul Vertikal Ramping (Tidak Melebar/Bantet di Laptop) */
  .pill-container {
    background-color: #5c5d61; /* Abu-abu kapsul elegan */
    color: #ffffff;
    width: 100%;
    max-width: 350px;       /* Lebar dikunci proporsional HP */
    min-height: 640px;      /* Menjaga tinggi agar tetap jenjang */
    border-radius: 175px;   /* Radius oval melengkung penuh */
    padding: 60px 32px 50px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    text-align: center;
  }

  .head-box {
    margin-top: 50px;
    margin-bottom: 45px;
  }

  .head-box h1 {
    font-size: 19px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }

  .sub {
    font-size: 13px;
    color: #d8d8d8;
  }

  /* Input Fields */
  .input-group {
    width: 100%;
    margin-bottom: 16px;
  }

  .field {
    width: 100%;
    height: 64px;
    padding: 0 24px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 15px;
    background-color: #dedede;
    color: #1e1e1e;
  }

  .field::placeholder {
    color: #4b4b4b;
  }

  /* Kolom Password + Ikon Mata */
  .pass-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 24px;
  }

  .pass-wrapper .field {
    padding-right: 52px;
  }

  .toggle-btn {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    user-select: none;
  }

  /* Tombol Aksi */
  .btn-submit {
    width: 100%;
    height: 64px;
    border-radius: 32px;
    border: none;
    background-color: #1d1e20;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .btn-submit:hover {
    background-color: #111112;
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .alt-links {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .alt-links button {
    background: none;
    border: none;
    color: #ffffff;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  .alt-links a {
    color: #d1d5db;
    text-decoration: none;
    font-size: 11px;
  }

  .alt-links a:hover {
    text-decoration: underline;
  }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #2b2b2b;
    text-align: center;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<main class="stage">
  <form class="pill-container" id="form" novalidate>
    <div class="head-box">
      <h1>Bergabunglah dengan Linkfoo</h1>
      <p class="sub" id="sub">Daftar Secara Gratis</p>
    </div>
    
    <div class="input-group">
      <input class="field" type="email" id="email" placeholder="Email" autocomplete="email" required>
    </div>
    
    <div class="pass-wrapper">
      <input class="field" type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-btn" id="togglePass" aria-label="Lihat Password">👁️</button>
    </div>

    <button class="btn-submit" id="submit" type="submit">Daftar</button>
    
    <div class="alt-links">
      <div id="alt"></div>
      <a href="index.html">&larr; Kembali ke halaman utama</a>
    </div>
  </form>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script>
(function () {
  const SUPABASE_URL = "https://phnprjmsyhhlkhtuvbpj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XsbjMe60D3qKxHjYTrV-QQ_ubdcgzx_";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = new URLSearchParams(location.search).get('mode') === 'login' ? 'login' : 'register';
  const $ = id => document.getElementById(id);

  // Toggle Visibility Password
  $('togglePass').addEventListener('click', () => {
    const isPass = $('pass').type === 'password';
    $('pass').type = isPass ? 'text' : 'password';
    $('togglePass').textContent = isPass ? '🙈' : '👁️';
  });

  function render() {
    const reg = mode === 'register';
    $('sub').textContent = reg ? 'Daftar Secara Gratis' : 'Masuk ke akun kamu';
    $('submit').textContent = reg ? 'Daftar' : 'Masuk';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('alt').innerHTML = reg
      ? 'Sudah punya akun? <button type="button" id="sw">Masuk</button>'
      : 'Belum punya akun? <button type="button" id="sw">Daftar</button>';
    $('sw').onclick = () => { mode = reg ? 'login' : 'register'; render(); };
  }
  render();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('pass').value;

    if (!email) return alert('Email wajib diisi');
    if (pass.length < 6) return alert('Password minimal 6 karakter');

    const btn = $('submit');
    btn.disabled = true;

    // Mode Masuk (Login)
    if (mode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) {
        btn.disabled = false;
        return alert('Gagal masuk: ' + error.message);
      }
      alert('Login berhasil!');
      location.href = 'edit.html';
      return;
    }

    // Mode Daftar (Register)
    const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
    if (error) {
      btn.disabled = false;
      return alert('Gagal mendaftar: ' + error.message);
    }
    alert('Pendaftaran berhasil! Akun tersimpan di cloud.');
    location.href = 'edit.html';
  });
})();
</script>
</body>
</html>
