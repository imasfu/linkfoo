<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daftar / Login - Linkfoo</title>
<!-- Library Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg-light: #8e8e8e;
    --card-bg: #383838;
    --text-white: #ffffff;
    --input-bg: #808080;
    --btn-bg: #1c1c1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  body.bg-light {
    background-color: var(--bg-light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .stage {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  /* Desain Kapsul Oval Sesuai Desain Awal Kamu */
  .pill.tall {
    background-color: var(--card-bg);
    color: var(--text-white);
    padding: 60px 36px;
    border-radius: 170px;
    width: 100%;
    max-width: 380px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  .pill h1 {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #ffffff;
  }

  .sub {
    font-size: 13px;
    color: #d1d5db;
    margin-bottom: 28px;
  }

  .field {
    width: 100%;
    padding: 13px 20px;
    border-radius: 25px;
    border: none;
    outline: none;
    margin-bottom: 14px;
    font-size: 14px;
    background-color: var(--input-bg);
    color: #ffffff;
  }

  .field::placeholder {
    color: #e5e7eb;
  }

  /* Kolom Password & Ikon Mata */
  .pass-box {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }

  .pass-box .field {
    margin-bottom: 0;
    padding-right: 48px;
  }

  .toggle-eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    user-select: none;
  }

  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 25px;
    border: none;
    background-color: var(--btn-bg);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .btn:hover {
    background-color: #000000;
  }

  .alt {
    font-size: 12px;
    color: #d1d5db;
    margin-top: 18px;
  }

  .alt button {
    background: none;
    border: none;
    color: #ffffff;
    font-weight: 700;
    text-decoration: underline;
    cursor: pointer;
  }

  .alt a {
    color: #d1d5db;
    text-decoration: none;
    font-size: 11px;
  }

  .alt a:hover {
    text-decoration: underline;
  }

  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #2b2b2b;
    text-align: center;
  }
</style>
</head>
<body class="bg-light">

<main class="stage">
  <form class="pill tall" id="form" novalidate>
    <h1>Bergabunglah dengan Linkfoo</h1>
    <p class="sub" id="sub">Daftar Secara Gratis</p>
    
    <input class="field" type="email" id="email" placeholder="Email" autocomplete="email" required>
    
    <div class="pass-box">
      <input class="field" type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-eye" id="togglePass" aria-label="Lihat Password">👁️</button>
    </div>

    <button class="btn" id="submit" type="submit">Daftar</button>
    <p class="alt" id="alt"></p>
    <p class="alt"><a href="index.html">&larr; Kembali ke halaman utama</a></p>
  </form>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script>
(function () {
  const SUPABASE_URL = "https://phnprjmsyhhlkhtuvbpj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XsbjMe60D3qKxHjYTrV-QQ_ubdcgzx_";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = new URLSearchParams(location.search).get('mode') === 'login' ? 'login' : 'register';
  const $ = id => document.getElementById(id);

  // Fitur intip password
  $('togglePass').addEventListener('click', () => {
    const isPass = $('pass').type === 'password';
    $('pass').type = isPass ? 'text' : 'password';
    $('togglePass').textContent = isPass ? '🙈' : '👁️';
  });

  function render() {
    const reg = mode === 'register';
    $('sub').textContent = reg ? 'Daftar Secara Gratis' : 'Masuk ke akun kamu';
    $('submit').textContent = reg ? 'Daftar' : 'Masuk';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('alt').innerHTML = reg
      ? 'Sudah punya akun? <button type="button" id="sw">Masuk</button>'
      : 'Belum punya akun? <button type="button" id="sw">Daftar</button>';
    $('sw').onclick = () => { mode = reg ? 'login' : 'register'; render(); };
  }
  render();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('pass').value;

    if (!email) return alert('Email wajib diisi');
    if (pass.length < 6) return alert('Password minimal 6 karakter');

    const btn = $('submit');
    btn.disabled = true;

    // Masuk (Login)
    if (mode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) {
        btn.disabled = false;
        return alert('Gagal masuk: ' + error.message);
      }
      alert('Login berhasil!');
      location.href = 'edit.html';
      return;
    }

    // Daftar (Sign Up)
    const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
    if (error) {
      btn.disabled = false;
      return alert('Gagal mendaftar: ' + error.message);
    }
    alert('Pendaftaran berhasil! Akun kamu sudah tersimpan di database online.');
    location.href = 'edit.html';
  });
})();
</script>
</body>
</html>
