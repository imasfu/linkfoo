<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daftar / Login - Linkfoo</title>
<!-- Library Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #d1d5db; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stage { width: 100%; display: flex; justify-content: center; padding: 20px; }
  .pill { background-color: #525252; color: #ffffff; padding: 40px 30px; border-radius: 120px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .pill h1 { font-size: 20px; margin-bottom: 6px; font-weight: 700; }
  .sub { font-size: 13px; color: #d4d4d4; margin-bottom: 24px; }
  .field { width: 100%; padding: 12px 18px; border-radius: 20px; border: none; outline: none; margin-bottom: 12px; font-size: 14px; background: #ffffff; color: #111; }
  .pass-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
  .pass-wrapper .field { margin-bottom: 0; padding-right: 45px; }
  .toggle-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; }
  .btn { width: 100%; padding: 12px; border-radius: 20px; border: none; background-color: #262626; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn:hover { background-color: #171717; }
  .alt { font-size: 12px; color: #e5e5e5; margin-top: 14px; }
  .alt button { background: none; border: none; color: #fff; text-decoration: underline; font-weight: 600; cursor: pointer; }
  .alt a { color: #e5e5e5; text-decoration: none; font-size: 11px; }
  .alt a:hover { text-decoration: underline; }
  .footer { margin-top: 25px; font-size: 12px; color: #737373; text-align: center; }
</style>
</head>
<body>

<main class="stage">
  <form class="pill" id="form" novalidate>
    <h1>Bergabunglah dengan Linkfoo</h1>
    <p class="sub" id="sub">Daftar Secara Gratis</p>
    
    <input class="field" type="email" id="email" placeholder="Email" autocomplete="email" required>
    
    <div class="pass-wrapper">
      <input class="field" type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-btn" id="togglePass" aria-label="Lihat Password">👁️</button>
    </div>

    <button class="btn" id="submit" type="submit">Daftar</button>
    <p class="alt" id="alt"></p>
    <p class="alt"><a href="index.html">&larr; Kembali ke halaman utama</a></p>
  </form>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<script>
(function () {
  const SUPABASE_URL = "https://phnprjmsyhhlkhtuvbpj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XsbjMe60D3qKxHjYTrV-QQ_ubdcgzx_";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = new URLSearchParams(location.search).get('mode') === 'login' ? 'login' : 'register';
  const $ = id => document.getElementById(id);

  // Toggle Password
  $('togglePass').addEventListener('click', () => {
    const isPassword = $('pass').type === 'password';
    $('pass').type = isPassword ? 'text' : 'password';
    $('togglePass').textContent = isPassword ? '🙈' : '👁️';
  });

  function render() {
    const reg = mode === 'register';
    $('sub').textContent = reg ? 'Daftar Secara Gratis' : 'Masuk ke akun kamu';
    $('submit').textContent = reg ? 'Daftar' : 'Masuk';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('alt').innerHTML = reg
      ? 'Sudah punya akun? <button type="button" id="sw">Masuk</button>'
      : 'Belum punya akun? <button type="button" id="sw">Daftar</button>';
    $('sw').onclick = () => { mode = reg ? 'login' : 'register'; render(); };
  }
  render();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('pass').value;

    if (!email) return alert('Email wajib diisi');
    if (pass.length < 6) return alert('Password minimal 6 karakter');

    const btn = $('submit');
    btn.disabled = true;

    if (mode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) {
        btn.disabled = false;
        return alert('Gagal masuk: ' + error.message);
      }
      alert('Login berhasil!');
      location.href = 'edit.html';
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
    if (error) {
      btn.disabled = false;
      return alert('Gagal mendaftar: ' + error.message);
    }
    alert('Pendaftaran berhasil! Akun sudah tersimpan di database online.');
    location.href = 'edit.html';
  });
})();
</script>

</body>
</html>
