<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Memuat library Supabase dari CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Daftar / Login - Linkfoo</title>
<!-- Path diperbaiki tanpa folder css/ -->
<link rel="stylesheet" href="style.css">
<style>
  .pass-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
  .pass-wrapper input { width: 100%; padding-right: 42px; }
  .toggle-btn { position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; }
</style>
</head>
<body class="bg-light">
<main class="stage">
  <form class="pill tall" id="form" novalidate>
    <h1>Bergabunglah dengan Linkfoo</h1>
    <p class="sub" id="sub">Daftar Secara Gratis</p>
    <input class="field" type="email" id="email" placeholder="Email" autocomplete="email" required>
    
    <div class="pass-wrapper">
      <input class="field" type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-btn" id="togglePass" aria-label="Lihat Password">👁️</button>
    </div>

    <button class="btn" id="submit" type="submit">Daftar</button>
    <p class="alt" id="alt"></p>
    <p class="alt"><a href="index.html">&larr; Kembali ke halaman utama</a></p>
  </form>
</main>
<div class="footer">Powered by IMFOO OFFICIAL</div>

<!-- Path diperbaiki tanpa folder js/ -->
<script src="./config.js"></script>
<script src="./app.js"></script>
<script>
(function () {
  let mode = new URLSearchParams(location.search).get('mode') === 'login' ? 'login' : 'register';
  const $ = id => document.getElementById(id);

  // Fitur Lihat / Sembunyikan Password
  $('togglePass').addEventListener('click', () => {
    const isPassword = $('pass').type === 'password';
    $('pass').type = isPassword ? 'text' : 'password';
    $('togglePass').textContent = isPassword ? '🙈' : '👁️';
  });

  function render() {
    const reg = mode === 'register';
    $('sub').textContent = reg ? 'Daftar Secara Gratis' : 'Masuk ke akun kamu';
    $('submit').textContent = reg ? 'Daftar' : 'Masuk';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('alt').innerHTML = reg
      ? 'Sudah punya akun? <button type="button" id="sw">Masuk</button>'
      : 'Belum punya akun? <button type="button" id="sw">Daftar</button>';
    $('sw').onclick = () => { mode = reg ? 'login' : 'register'; render(); };
  }
  render();

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('email').value.trim().toLowerCase();
    const pass = $('pass').value;

    if (!LF.validEmail(email)) return LF.toast('Email tidak valid');
    if (pass.length < 6) return LF.toast('Password minimal 6 karakter');

    const btn = $('submit');
    btn.disabled = true;

    // 1. Logika Masuk (Login) ke Supabase
    if (mode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: pass,
      });

      if (error) {
        btn.disabled = false;
        return LF.toast('Gagal masuk: ' + error.message);
      }

      LF.set('lf_session', { email: data.user.email, id: data.user.id });
      LF.toast('Login berhasil!');
      setTimeout(() => { location.href = 'edit.html'; }, 1000);
      return;
    }

    // 2. Logika Daftar (Sign Up) ke Supabase
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: pass,
    });

    if (error) {
      btn.disabled = false;
      return LF.toast('Gagal mendaftar: ' + error.message);
    }

    LF.set('lf_session', { email: data.user.email, id: data.user.id });
    LF.toast('Pendaftaran berhasil! Menyimpan ke cloud...');
    setTimeout(() => { location.href = 'edit.html'; }, 1200);
  });
})();
</script>
</body>
</html>
